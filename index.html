<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPurify | AI Metadata Scrubber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Drag & Drop Zone */
        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.4);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .drop-zone:hover {
            border-color: var(--accent);
        }

        .drop-zone svg {
            width: 50px;
            height: 50px;
            fill: var(--text-muted);
            margin-bottom: 15px;
            transition: fill 0.2s;
        }

        .drop-zone:hover svg { fill: var(--accent); }

        .drop-zone-text {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .drop-zone-subtext {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        input[type="file"] { display: none; }

        /* Workspace (Active Image Mode) */
        .workspace { display: none; }

        .image-preview-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            background: #000;
        }

        img#imagePreview {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: contain;
            display: block;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        .status-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
        }

    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>PixelPurify</h1>
        <p>Locally strip AI watermarks & EXIF metadata.</p>
    </div>

    <!-- Upload State -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/24/svg">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="drop-zone-text">Tap or drop image here</div>
        <div class="drop-zone-subtext">Supports PNG, JPG, WEBP</div>
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">
    </div>

    <!-- Workspace State -->
    <div class="workspace" id="workspace">
        <div class="image-preview-wrapper">
            <img id="imagePreview" alt="Preview">
        </div>
        
        <div class="btn-group">
            <button class="btn btn-secondary" id="resetBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button class="btn btn-primary" id="downloadBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Purify & Download
            </button>
        </div>
        <div class="status-badge" id="statusBadge">✅ Metadata scrubbed & saved!</div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const imagePreview = document.getElementById('imagePreview');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusBadge = document.getElementById('statusBadge');

    let originalFile = null;

    // --- Drag & Drop Logic ---
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    });

    fileInput.addEventListener('change', function() {
        handleFiles(this.files);
    });

    // --- Processing Logic ---
    function handleFiles(files) {
        if (files.length === 0) return;
        originalFile = files[0];

        if (!originalFile.type.startsWith('image/')) {
            alert('Please upload an image file.');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            imagePreview.src = e.target.result;
            dropZone.style.display = 'none';
            workspace.style.display = 'block';
            statusBadge.style.opacity = '0';
        };
        reader.readAsDataURL(originalFile);
    }

    resetBtn.addEventListener('click', () => {
        dropZone.style.display = 'block';
        workspace.style.display = 'none';
        fileInput.value = '';
        originalFile = null;
    });

    downloadBtn.addEventListener('click', () => {
        if (!imagePreview.src) return;

        // Change button state to show processing
        const originalBtnHTML = downloadBtn.innerHTML;
        downloadBtn.innerHTML = 'Processing...';
        downloadBtn.disabled = true;

        // Use a short timeout to let UI update before heavy canvas operations
        setTimeout(() => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = imagePreview.naturalWidth;
            canvas.height = imagePreview.naturalHeight;
            
            // Drawing the image strips all EXIF/AI tags
            ctx.drawImage(imagePreview, 0, 0);

            // Use toBlob instead of toDataURL for better memory management on large files
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                
                // Keep extension clean
                const ext = originalFile.name.split('.').pop();
                const baseName = originalFile.name.substring(0, originalFile.name.lastIndexOf('.')) || originalFile.name;
                link.download = `${baseName}_purified.${ext}`;
                link.href = url;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Cleanup memory
                URL.revokeObjectURL(url);

                // Reset Button & Show Success
                downloadBtn.innerHTML = originalBtnHTML;
                downloadBtn.disabled = false;
                statusBadge.style.opacity = '1';

                setTimeout(() => {
                    statusBadge.style.opacity = '0';
                }, 3500);

            }, originalFile.type, 1.0); // 1.0 retains maximum image quality
        }, 100);
    });
</script>

</body>
</html>
