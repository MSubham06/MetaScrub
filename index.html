<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelPurify | AI Metadata Scrubber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 100%;
            max-width: 420px; /* Perfect for mobile/tablet */
            text-align: center;
            transition: all 0.3s ease;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        /* Drag & Drop / Tap Zone */
        .drop-zone {
            border: 2px dashed rgba(148, 163, 184, 0.3);
            border-radius: 16px;
            padding: 3rem 1.5rem;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
        }

        .drop-zone:active { transform: scale(0.98); }
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .drop-zone svg {
            width: 48px;
            height: 48px;
            fill: var(--accent);
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .drop-zone-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }
        
        .drop-zone-subtext {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        input[type="file"] { display: none; }

        /* Workspace State */
        .workspace { display: none; }

        .image-preview-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid var(--glass-border);
            background: #000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        img#imagePreview {
            width: 100%;
            height: auto;
            max-height: 40vh; /* Keeps buttons on screen on mobile */
            object-fit: contain;
            display: block;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-direction: row;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.96); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            flex: 0.25;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            flex: 0.75;
            box-shadow: 0 8px 20px var(--accent-glow);
            position: relative;
        }

        .btn-primary:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-badge {
            margin-top: 1rem;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(10px);
            display: inline-block;
        }

        .status-badge.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .app-container { padding: 1.5rem; border-radius: 20px; }
            .drop-zone { padding: 2.5rem 1rem; }
            .header h1 { font-size: 1.5rem; }
            .btn { padding: 14px; font-size: 0.95rem; }
            img#imagePreview { max-height: 45vh; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>PixelPurify</h1>
        <p>Strip EXIF & AI generation tags locally.</p>
    </div>

    <!-- Upload Zone -->
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/24/svg">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="drop-zone-text">Tap to select image</div>
        <div class="drop-zone-subtext">JPG, PNG, WEBP (100% Offline)</div>
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">
    </div>

    <!-- Processing Workspace -->
    <div class="workspace" id="workspace">
        <div class="image-preview-wrapper">
            <img id="imagePreview" alt="Image Preview">
        </div>
        
        <div class="btn-group">
            <button class="btn btn-secondary" id="resetBtn" aria-label="Upload new image">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button class="btn btn-primary" id="downloadBtn">
                <div class="spinner" id="btnSpinner"></div>
                <svg id="btnIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span id="btnText">Purify & Save</span>
            </button>
        </div>
        <div class="status-badge" id="statusBadge">✨ Metadata destroyed!</div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const workspace = document.getElementById('workspace');
    const imagePreview = document.getElementById('imagePreview');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusBadge = document.getElementById('statusBadge');
    
    // UI Elements for Processing State
    const btnSpinner = document.getElementById('btnSpinner');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');

    let originalFile = null;

    // --- Drag & Drop Handling ---
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, e => {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
    fileInput.addEventListener('change', function() { handleFiles(this.files); });

    // --- Image Loading ---
    function handleFiles(files) {
        if (files.length === 0) return;
        originalFile = files[0];

        if (!originalFile.type.startsWith('image/')) {
            alert('Please upload an image file (JPG, PNG, WEBP).');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            imagePreview.src = e.target.result;
            dropZone.style.display = 'none';
            workspace.style.display = 'block';
            statusBadge.classList.remove('show');
        };
        reader.readAsDataURL(originalFile);
    }

    // --- Reset Workspace ---
    resetBtn.addEventListener('click', () => {
        dropZone.style.display = 'block';
        workspace.style.display = 'none';
        fileInput.value = '';
        originalFile = null;
        statusBadge.classList.remove('show');
    });

    // --- Scrubbing & Download Engine ---
    downloadBtn.addEventListener('click', () => {
        if (!imagePreview.src) return;

        // 1. Show Processing UI
        downloadBtn.disabled = true;
        btnIcon.style.display = 'none';
        btnSpinner.style.display = 'block';
        btnText.innerText = 'Purifying...';
        statusBadge.classList.remove('show');

        // 2. Allow UI to update before freezing the thread with Canvas rendering
        setTimeout(() => {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Keep original resolution
                canvas.width = imagePreview.naturalWidth;
                canvas.height = imagePreview.naturalHeight;
                
                // Drawing strips all non-pixel data (EXIF, C2PA, Location, etc.)
                ctx.drawImage(imagePreview, 0, 0);

                // Export back to Blob
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    
                    // Format filename
                    const ext = originalFile.name.split('.').pop();
                    const baseName = originalFile.name.substring(0, originalFile.name.lastIndexOf('.')) || originalFile.name;
                    link.download = `${baseName}_purified.${ext}`;
                    link.href = url;
                    
                    // Trigger mobile/desktop download
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    // 3. Restore UI & Show Success
                    finishProcessing(true);
                }, originalFile.type, 1.0); 

            } catch (err) {
                console.error(err);
                finishProcessing(false);
                alert("Something went wrong processing the image. Try a smaller file.");
            }
        }, 150); // 150ms buffer ensures spinner animates on older phones
    });

    function finishProcessing(success) {
        downloadBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnIcon.style.display = 'block';
        btnText.innerText = 'Purify & Save';
        
        if (success) {
            statusBadge.classList.add('show');
            setTimeout(() => statusBadge.classList.remove('show'), 3500);
        }
    }
</script>

</body>
</html>
